# This is a sample workflow to check the action
# This file does not run while it stays here
# Copy it into .github/workflows/ when you want to check
# Open a PR and it runs the action on Node 24
# It reads the number of approvals of the PR
# The output must be a number to be OK
# This action reads the PR context so it runs on pull_request
# We ran it on ubuntu-24.04 with Node 24 and it passed
name: Verify Node 24

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  approvals-verify:
    runs-on: ubuntu-latest
    steps:
      - id: count
        uses: dayone-jp/approvals@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify output
        run: |
          echo "approvals output = '${{ steps.count.outputs.approvals }}'"
          case "${{ steps.count.outputs.approvals }}" in
            ''|*[!0-9]*)
              echo "::error::approvals output is not a number" ; exit 1 ;;
            *)
              echo "OK: approvals is a number" ;;
          esac
